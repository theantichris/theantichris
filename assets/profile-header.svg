<svg xmlns="http://www.w3.org/2000/svg" width="960" height="216" viewBox="0 0 960 216" role="img" aria-labelledby="title desc">
  <title id="title">theantichris — People. Systems. Good judgment.</title>
  <desc id="desc">A static terminal-inspired banner in charcoal, cyan, and pink, using Christopher's dotfiles palette.</desc>
  <!-- Christopher's palette: theantichris/dotfiles .chezmoidata/cyberpunk.yaml -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8A86A0" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="960" height="216" rx="12" fill="#16161E"/>
  <rect x="1" y="1" width="958" height="214" rx="11" fill="url(#grid)" stroke="#2A2A33"/>
  <path d="M0 35H960" stroke="#2A2A33"/>
  <g fill="#8A86A0">
    <circle cx="22" cy="18" r="3"/>
    <circle cx="34" cy="18" r="3"/>
    <circle cx="46" cy="18" r="3"/>
  </g>
  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace">
    <text x="66" y="22" fill="#8A86A0" font-size="11" letter-spacing="1">~/theantichris</text>
    <text x="36" y="75" fill="#00F0FF" font-size="14" letter-spacing="2">PEOPLE / SYSTEMS / GOOD JUDGMENT</text>
    <text x="33" y="130" fill="#EAEAF2" font-size="42" font-weight="bold" letter-spacing="-1">Christopher Lamm<tspan fill="#00F0FF">_</tspan></text>
    <text x="36" y="171" fill="#EAEAF2" font-size="17">Engineering leadership. Still building.</text>
  </g>
  <path d="M820 71H918V169H858" fill="none" stroke="#CA0174" stroke-width="2"/>
